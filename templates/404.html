{% extends 'base.html' %}

{% block title %}Eclipse Protocol 404 Error{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="text-center">
                <h1 class="display-1 fw-bold mb-3">404</h1>
                <h2 class="h3 mb-4">Page Not Found</h2>
                <p class="lead mb-4">
                    Sorry, the page you're looking for doesn't exist.
                </p>
                
                <div class="d-flex gap-3 justify-content-center">
                    <a href="{% url 'home' %}" class="btn btn-primary address-buttons" id="address-buttons">
                        Go Home
                    </a>
                    <a href="{% url 'catalog:search_results' %}" class="btn btn-outline-light">
                        Browse Products
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
