{% extends "base.html" %}
{% load static %}

{% block content %}
<main class="page-section py-5">
    <div class="container text-center text-white"
        style="min-height:60vh; display:flex; align-items:center; justify-content:center;">
        <div class="w-100" style="max-width:720px;">
            <div class="mb-4">
                <i class="fa fa-check-circle fa-3x mb-3" aria-hidden="true"></i>
                <h1 class="display-6 fw-bold">Your message has been submitted</h1>
            </div>
            <p class="lead mb-4">
                Thank you for reaching out to our support team. We have received your message and will get back to you
                as soon as possible.
            </p>
            <div class="mb-5">
                <a href="/" class="btn btn-buy-now btn-primary btn-lg">Home</a>
            </div>
        </div>
    </div>
</main>
{% endblock %}
